###############################################################################
# Ping Identity Test - PingAccess/PingFederate/PingIntelligence Integration Test (BRUNO)
#
# Bruno variant of pa-pf-pi-integration.yaml. Runs the converted Bruno collection
# (helm-tests/bruno/pa-pf-pi); the check step installs
# @usebruno/cli from npm at test time (scratch/postman-to-bruno-migration-plan.md
# D2 phase 2).
#
# Parallel-run rollout (plan D7): this yaml coexists with pa-pf-pi-integration.yaml
# (newman) until Bruno passes in CI, then the newman yaml + Postman collection are
# deleted per-suite (plan S4).
#
# ConfigMap assets (uploaded by run_helm_tests.sh):
#   <release>-bruno-collection.tar.gz        tarball of helm-tests/bruno/pa-pf-pi/
#   <release>-generated.bruno-environment.json  env vars scraped from *-env-vars CMs
###############################################################################
httpcan:
  enabled: true
  containerPort: 8080
  service:
    name: httpcan
    port: 80
    targetPort: 8080

pingintelligence:
  enabled: true
  envs:
    PING_INTELLIGENCE_ABS_DEPLOYMENT_TYPE: "onprem"
    PING_INTELLIGENCE_ASE_ENABLE_ABS: "false"
    SERVER_PROFILE_URL: https://github.com/pingidentity/pingidentity-server-profiles.git
    SERVER_PROFILE_PATH: pa-pf-pi-integration/pingintelligence
  container:
    waitFor:
      pingaccess-engine:
        service: https
        timeoutSeconds: 300

pingaccess-admin:
  enabled: true
  privateCert:
    generate: true
  envs:
    SERVER_PROFILE_URL: https://github.com/pingidentity/pingidentity-server-profiles.git
    SERVER_PROFILE_PATH: pa-pf-pi-integration/pingaccess
  container:
    waitFor:
      pingfederate-engine:
        service: https
        timeoutSeconds: 300

pingaccess-engine:
  enabled: true
  envs:
    SERVER_PROFILE_URL: https://github.com/pingidentity/pingidentity-server-profiles.git
    SERVER_PROFILE_PATH: pa-pf-pi-integration/pingaccess

pingfederate-admin:
  enabled: true
  privateCert:
    generate: true
  envs:
    SERVER_PROFILE_URL: https://github.com/pingidentity/pingidentity-server-profiles.git
    SERVER_PROFILE_PATH: pa-pf-pi-integration/pingfederate

pingfederate-engine:
  enabled: true
  envs:
    SERVER_PROFILE_URL: https://github.com/pingidentity/pingidentity-server-profiles.git
    SERVER_PROFILE_PATH: pa-pf-pi-integration/pingfederate

###############################################################################
# Test Steps
###############################################################################
testFramework:
  enabled: true
  testConfigMaps:
    # DEFAULTS (found in helm chart values.yaml)
    # prefix: ping-devops-test-
    # volumeMountPath: /var/run/
    files:
      - bruno-collection.tar.gz
      - generated.bruno-environment.json

  testSteps:
    - name: 01-wait-for
      waitFor:
        pingfederate-admin:
          service: https
        pingfederate-engine:
          service: https
        pingaccess-admin:
          service: https
        pingaccess-engine:
          service: https
        pingintelligence:
          service: https

    - name: 02-check-pa-pf-pi-bruno
      image: node:22-alpine
      env:
        # npm needs a writable HOME for its cache; the chart runs this container
        # as runAsUser 9031 and /var/run is the writable mount.
        - name: HOME
          value: /var/run/shared
      command:
        - /bin/sh
        - -c
        - |
          set -e
          cd /var/run/shared
          mkdir -p bruno-collection
          tar -xzf /var/run/bruno-collection.tar.gz -C bruno-collection
          npm install @usebruno/cli@4.1.0 --silent --no-audit --no-fund --no-save
          cd bruno-collection
          ../node_modules/.bin/bru run . --env-file /var/run/generated.bruno-environment.json --insecure --output ../bru-results.json

