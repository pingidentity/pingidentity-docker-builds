###############################################################################
# Ping Identity Test - PingAccess/PingFederate/PingDirectory Integration Test (BRUNO)
#
# Bruno variant of pa-pf-pd-integration.yaml. Runs the converted Bruno collection
# (helm-tests/bruno/pa-pf-pd); the check step installs
# @usebruno/cli from npm at test time (scratch/postman-to-bruno-migration-plan.md
# D2 phase 2).
#
# Parallel-run rollout (plan D7): this yaml coexists with pa-pf-pd-integration.yaml
# (newman) until Bruno passes in CI, then the newman yaml + Postman collection are
# deleted per-suite (plan S4).
#
# ConfigMap assets (uploaded by run_helm_tests.sh):
#   <release>-bruno-collection.tar.gz        tarball of helm-tests/bruno/pa-pf-pd/
#   <release>-generated.bruno-environment.json  env vars scraped from *-env-vars CMs
###############################################################################
httpcan:
  enabled: true
  containerPort: 8080
  service:
    name: httpcan
    port: 80
    targetPort: 8080

pingaccess-admin:
  enabled: true
  privateCert:
    generate: true
  envs:
    SERVER_PROFILE_URL: https://github.com/pingidentity/pingidentity-server-profiles.git
    SERVER_PROFILE_PATH: baseline-integration-tests/pingaccess-env-config
  container:
    waitFor:
      pingfederate-engine:
        service: https
        timeoutSeconds: 300

pingaccess-engine:
  enabled: true
  envs:
    SERVER_PROFILE_URL: https://github.com/pingidentity/pingidentity-server-profiles.git
    SERVER_PROFILE_PATH: baseline-integration-tests/pingaccess-env-config
  container:
    waitFor:
      pingdirectory:
        service: ldaps

pingdirectory:
  container:
    resources:
      requests:
        cpu: 2
        memory: 4Gi
      limits:
        cpu: 2
        memory: 4Gi
  enabled: true
  envs:
    SERVER_PROFILE_URL: https://github.com/pingidentity/pingidentity-server-profiles.git
    SERVER_PROFILE_PATH: baseline-integration-tests/pingdirectory
    MAX_HEAP_SIZE: 2g

pingfederate-admin:
  enabled: true
  privateCert:
    generate: true
  envs:
    SERVER_PROFILE_URL: https://github.com/pingidentity/pingidentity-server-profiles.git
    SERVER_PROFILE_PATH: baseline-integration-tests/pingfederate-env-config
  container:
    waitFor:
      pingdirectory:
        service: ldaps

pingfederate-engine:
  enabled: true
  envs:
    SERVER_PROFILE_URL: https://github.com/pingidentity/pingidentity-server-profiles.git
    SERVER_PROFILE_PATH: baseline-integration-tests/pingfederate-env-config

###############################################################################
# Test Steps
###############################################################################
testFramework:
  enabled: true
  testConfigMaps:
    # DEFAULTS (found in helm chart values.yaml)
    # prefix: ping-devops-test-
    # volumeMountPath: /var/run/
    files:
      - bruno-collection.tar.gz
      - generated.bruno-environment.json
      - wait-for-url.sh

  testSteps:
    - name: 01-wait-for-pingdirectory-0
      image: pingidentity/pingtoolkit:latest
      command:
        - /bin/sh
        - /var/run/wait-for-url.sh
        - https://${PD_ENGINE_PRIVATE_HOSTNAME}:${PD_ENGINE_PRIVATE_PORT_HTTPS}/available-state
        - "900"

    - name: 01a-wait-for-pingfederate-admin
      image: pingidentity/pingtoolkit:latest
      command:
        - /bin/sh
        - /var/run/wait-for-url.sh
        - https://${PF_ADMIN_PRIVATE_HOSTNAME}:${PF_ADMIN_PRIVATE_PORT_HTTPS}/pingfederate/app
        - "900"

    - name: 01b-wait-for-pingfederate-engine
      image: pingidentity/pingtoolkit:latest
      command:
        - /bin/sh
        - /var/run/wait-for-url.sh
        - https://${PF_ENGINE_PRIVATE_HOSTNAME}:${PF_ENGINE_PRIVATE_PORT_HTTPS}/pf/heartbeat.ping
        - "900"

    - name: 01c-wait-for-pingaccess-admin
      image: pingidentity/pingtoolkit:latest
      command:
        - /bin/sh
        - /var/run/wait-for-url.sh
        - https://${PA_ADMIN_PRIVATE_HOSTNAME}:${PA_ADMIN_PRIVATE_PORT_HTTPS}/pa/heartbeat.ping
        - "900"

    - name: 01d-wait-for-pingaccess-engine
      image: pingidentity/pingtoolkit:latest
      command:
        - /bin/sh
        - /var/run/wait-for-url.sh
        - https://${PA_ENGINE_PRIVATE_HOSTNAME}:${PA_ENGINE_PRIVATE_PORT_HTTPS}/pa/heartbeat.ping
        - "900"

    - name: 02-check-pa-pf-pd-bruno
      image: node:22-alpine
      env:
        # npm needs a writable HOME for its cache; the chart runs this container
        # as runAsUser 9031 and /var/run is the writable mount.
        - name: HOME
          value: /var/run/shared
      command:
        - /bin/sh
        - -c
        - |
          set -e
          cd /var/run/shared
          mkdir -p bruno-collection
          tar -xzf /var/run/bruno-collection.tar.gz -C bruno-collection
          npm install @usebruno/cli@4.1.0 --silent --no-audit --no-fund --no-save
          cd bruno-collection
          ../node_modules/.bin/bru run . --env-file /var/run/generated.bruno-environment.json --insecure --output ../bru-results.json

