###############################################################################
# Ping Identity Test - PingDataSync/PingDirectory Integration Test (BRUNO)
#
# Bruno variant of pds-pd-integration.yaml. Runs the converted Bruno collection
# (helm-tests/bruno/pds-pd); the check step installs
# @usebruno/cli from npm at test time (scratch/postman-to-bruno-migration-plan.md
# D2 phase 2).
#
# Parallel-run rollout (plan D7): this yaml coexists with pds-pd-integration.yaml
# (newman) until Bruno passes in CI, then the newman yaml + Postman collection are
# deleted per-suite (plan S4).
#
# ConfigMap assets (uploaded by run_helm_tests.sh):
#   <release>-bruno-collection.tar.gz        tarball of helm-tests/bruno/pds-pd/
#   <release>-generated.bruno-environment.json  env vars scraped from *-env-vars CMs
###############################################################################
pingdirectory:
  enabled: true
  envs:
    USER_BASE_DN: o=sync
    SERVER_PROFILE_URL: https://github.com/pingidentity/pingidentity-server-profiles.git
    SERVER_PROFILE_PATH: simple-sync/pingdirectory
  services:
    https:
      containerPort: 1443
      clusterService: true

pingdatasync:
  enabled: true
  envs:
    USER_BASE_DN: o=sync
    SERVER_PROFILE_URL: https://github.com/pingidentity/pingidentity-server-profiles.git
    SERVER_PROFILE_PATH: simple-sync/pingdatasync

###############################################################################
# Test Steps
###############################################################################
testFramework:
  enabled: true
  testConfigMaps:
    # DEFAULTS (found in helm chart values.yaml)
    # prefix: ping-devops-test-
    # volumeMountPath: /var/run/
    files:
      - wait-for-url.sh
      - bruno-collection.tar.gz
      - generated.bruno-environment.json
      - global-init-test.sh

  testSteps:
    - name: 01-wait-for-pingdirectory
      image: pingidentity/pingtoolkit:latest
      command:
        - /bin/sh
        - /var/run/wait-for-url.sh
        - https://${PD_ENGINE_PRIVATE_HOSTNAME}-0.${PD_ENGINE_PRIVATE_HOSTNAME}-cluster:1443/available-state
        - "900"
      waitFor:
        pingdirectory:
          service: https

    - name: 02-get-dse
      image: ${DEPS_REGISTRY}pingidentity/ldap-sdk-tools:latest
      command:
        - /bin/sh
        - -c
        - ldapsearch --baseDN "" --hostname $PD_ENGINE_PRIVATE_HOSTNAME --port $PD_ENGINE_PRIVATE_PORT_LDAPS --useSSL --trustAll --scope base "(&)"

    - name: 03-wait-for-pingdatasync
      waitFor:
        pingdatasync:
          service: https

    - name: 04-check-pds-pd-bruno
      image: node:22-alpine
      env:
        # npm needs a writable HOME for its cache; the chart runs this container
        # as runAsUser 9031 and /var/run is the writable mount.
        - name: HOME
          value: /var/run/shared
      command:
        - /bin/sh
        - -c
        - |
          set -e
          cd /var/run/shared
          mkdir -p bruno-collection
          tar -xzf /var/run/bruno-collection.tar.gz -C bruno-collection
          npm install @usebruno/cli@4.1.0 --silent --no-audit --no-fund --no-save
          cd bruno-collection
          ../node_modules/.bin/bru run . --env-file /var/run/generated.bruno-environment.json --insecure --output ../bru-results.json
