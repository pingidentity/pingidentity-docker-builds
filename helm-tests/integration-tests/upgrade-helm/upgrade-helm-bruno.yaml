###############################################################################
# Ping Identity Test - Helm Upgrade Test (BRUNO)
#
# Bruno variant of upgrade-helm.yaml. Runs the converted Bruno collection
# (helm-tests/bruno/upgrade-helm); the check step installs
# @usebruno/cli from npm at test time (scratch/postman-to-bruno-migration-plan.md
# D2 phase 2).
#
# Parallel-run rollout (plan D7): this yaml coexists with upgrade-helm.yaml
# (newman) until Bruno passes in CI, then the newman yaml + Postman collection are
# deleted per-suite (plan S4).
#
# ConfigMap assets (uploaded by run_helm_tests.sh):
#   <release>-bruno-collection.tar.gz        tarball of helm-tests/bruno/upgrade-helm/
#   <release>-generated.bruno-environment.json  env vars scraped from *-env-vars CMs
###############################################################################
testFramework:
  enabled: true
  testConfigMaps:
    # DEFAULTS (found in helm chart values.yaml)
    # prefix: ping-devops-test-
    # volumeMountPath: /var/run/
    files:
      - global-init-test.sh
      - newfile.yaml
      - bruno-collection.tar.gz
      - generated.bruno-environment.json
      - wait-for-url.sh

  testSteps:
    - name: 00a-kubectl-version
      image: alpine/k8s:1.20.7
      command:
        - kubectl
        - version

    - name: 00b-kubectl-get-pvcs
      image: alpine/k8s:1.20.7
      command:
        - kubectl
        - get
        - pvc

    - name: 00c-add-repo
      image: alpine/k8s:1.20.7
      command:
        - helm
        - repo
        - add
        - pingidentity
        - https://helm.pingidentity.com/
        - --repository-config
        - "/var/run/shared/.config/helm/repositories.yaml"
        - --repository-cache
        - "/var/run/shared/.cache/helm/repository/pingidentity-index.yaml"

    - name: 00d-search-repo
      image: alpine/k8s:1.20.7
      command:
        - helm
        - search
        - repo
        - --repository-cache
        - "/var/run/shared/.cache/helm/repository/pingidentity-index.yaml"
        - --repository-config
        - "/var/run/shared/.config/helm/repositories.yaml"

    - name: 01-update-value-file
      image: alpine/k8s:1.20.7
      command:
        - helm
        - upgrade
        - dbt-upgrade-helm
        - pingidentity/ping-devops
        - -f
        - /var/run/newfile.yaml
        - --repository-cache
        - "/var/run/shared/.cache/helm/repository/pingidentity-index.yaml"
        - --repository-config
        - "/var/run/shared/.config/helm/repositories.yaml"

    - name: 02a-wait-for-pingdfederate-admin
      image: pingidentity/pingtoolkit:2106 #${DEPS_REGISTRY}pingidentity/pingtoolkit:2106
      command:
        - /bin/sh
        - /var/run/wait-for-url.sh
        - https://${PF_ADMIN_PRIVATE_HOSTNAME}:9999/pingfederate/app
        - "900"

    - name: 02b-wait-for-pingdfederate-engine
      image: pingidentity/pingtoolkit:2106 #${DEPS_REGISTRY}pingidentity/pingtoolkit:2106
      command:
        - /bin/sh
        - /var/run/wait-for-url.sh
        - https://${PF_ENGINE_PRIVATE_HOSTNAME}:9031/pf/heartbeat.ping
        - "900"

    - name: 03-check-pf-helm-bruno
      image: node:22-alpine
      env:
        # npm needs a writable HOME for its cache; the chart runs this container
        # as runAsUser 9031 and /var/run is the writable mount.
        - name: HOME
          value: /var/run/shared
      command:
        - /bin/sh
        - -c
        - |
          set -e
          cd /var/run/shared
          mkdir -p bruno-collection
          tar -xzf /var/run/bruno-collection.tar.gz -C bruno-collection
          npm install @usebruno/cli@4.1.0 --silent --no-audit --no-fund --no-save
          cd bruno-collection
          ../node_modules/.bin/bru run . --env-file /var/run/generated.bruno-environment.json --insecure --output ../bru-results.json
