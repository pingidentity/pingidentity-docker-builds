###############################################################################
# Ping Identity Test - PingDirectory Smoke Test (BRUNO)
#
# Bruno variant of pd-smoke.yaml. Runs the converted Bruno collection
# (helm-tests/bruno/pingdirectory); the check step installs @usebruno/cli from
# npm at test time (scratch/postman-to-bruno-migration-plan.md D2 phase 2).
#
# The newman yaml + Postman collection were deleted once Bruno passed locally
# and in CI (plan S4).
#
# ConfigMap assets (uploaded by run_helm_tests.sh):
#   <release>-bruno-collection.tar.gz        tarball of helm-tests/bruno/pingdirectory/
#   <release>-generated.bruno-environment.json  env vars scraped from *-env-vars CMs
###############################################################################
pingdirectory:
  enabled: true
  container:
    replicaCount: 1
    resources:
      requests:
        cpu: 2
        memory: 2Gi
      limits:
        cpu: 2
        memory: 2Gi
  envs:
    MAKELDIF_USERS: "1000"

###############################################################################
# Test Steps
###############################################################################
testFramework:
  enabled: true
  testConfigMaps:
    files:
      - bruno-collection.tar.gz
      - generated.bruno-environment.json
      - wait-for-url.sh

  testSteps:
    - name: 01-wait-for-pingdirectory-0
      image: pingidentity/pingtoolkit:latest
      command:
        - /bin/sh
        - /var/run/wait-for-url.sh
        - https://${PD_ENGINE_PRIVATE_HOSTNAME}:${PD_ENGINE_PRIVATE_PORT_HTTPS}/available-state
        - "900"

    - name: 02-get-dse
      image: ${DEPS_REGISTRY}pingidentity/ldap-sdk-tools
      command: ["/bin/sh"]
      args:
        - -c
        - >-
            echo "hostname: $(PD_ENGINE_PRIVATE_HOSTNAME)" &&
            echo $(PD_ENGINE_PRIVATE_PORT_LDAPS) &&
            /opt/tools/ldapsearch --baseDN "" --hostname $(PD_ENGINE_PRIVATE_HOSTNAME) --port $(PD_ENGINE_PRIVATE_PORT_LDAPS) --useSSL --trustAll --scope base "(&)"

    - name: 02-check-pd-helm-bruno
      image: node:22-alpine
      env:
        # npm needs a writable HOME for its cache; the chart runs this container
        # as runAsUser 9031 and /var/run is the writable mount.
        - name: HOME
          value: /var/run/shared
      command:
        - /bin/sh
        - -c
        - |
          set -e
          cd /var/run/shared
          mkdir -p bruno-collection
          tar -xzf /var/run/bruno-collection.tar.gz -C bruno-collection
          npm install @usebruno/cli@4.1.0 --silent --no-audit --no-fund --no-save
          cd bruno-collection
          ../node_modules/.bin/bru run . --env-file /var/run/generated.bruno-environment.json --insecure --output ../bru-results.json
