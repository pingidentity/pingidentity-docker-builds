###############################################################################
# Ping Identity Test - PingIntelligence Smoke Test (BRUNO)
#
# Bruno variant of pi-smoke.yaml. Runs the converted Bruno collection
# (helm-tests/bruno/pingintelligence); the check step installs
# @usebruno/cli from npm at test time (scratch/postman-to-bruno-migration-plan.md
# D2 phase 2).
#
# Parallel-run rollout (plan D7): this yaml coexists with pi-smoke.yaml
# (newman) until Bruno passes in CI, then the newman yaml + Postman collection are
# deleted per-suite (plan S4).
#
# ConfigMap assets (uploaded by run_helm_tests.sh):
#   <release>-bruno-collection.tar.gz        tarball of helm-tests/bruno/pingintelligence/
#   <release>-generated.bruno-environment.json  env vars scraped from *-env-vars CMs
###############################################################################
pingintelligence:
  enabled: true
  envs:
    PING_INTELLIGENCE_ABS_DEPLOYMENT_TYPE: "onprem"
    PING_INTELLIGENCE_ASE_ENABLE_ABS: "false"
  container:
    resources:
      requests:
        cpu: 1
        memory: 2Gi
      limits:
        cpu: 1
        memory: 2Gi

###############################################################################
# Test Steps
###############################################################################
testFramework:
  enabled: true
  testConfigMaps:
    files:
      - global-init-test.sh
      - bruno-collection.tar.gz
      - generated.bruno-environment.json

  testSteps:
    - name: 01-wait-for
      waitFor:
        pingintelligence:
          service: https

    - name: 02-check-pi-helm-bruno
      image: node:22-alpine
      env:
        # npm needs a writable HOME for its cache; the chart runs this container
        # as runAsUser 9031 and /var/run is the writable mount.
        - name: HOME
          value: /var/run/shared
      command:
        - /bin/sh
        - -c
        - |
          set -e
          cd /var/run/shared
          mkdir -p bruno-collection
          tar -xzf /var/run/bruno-collection.tar.gz -C bruno-collection
          npm install @usebruno/cli@4.1.0 --silent --no-audit --no-fund --no-save
          cd bruno-collection
          ../node_modules/.bin/bru run . --env-file /var/run/generated.bruno-environment.json --insecure --output ../bru-results.json

