name: dind runner — real build probe
on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'runner label suffix'
        default: 'x86'
permissions:
  contents: read
jobs:
  build:
    name: build pingtoolkit via build_product.sh
    runs-on: ping-internal-${{ inputs.arch }}-dind
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Docker daemon + arch
        run: |
          docker version
          echo "arch: $(uname -m)  runner: $RUNNER_NAME"
      - name: Pull-test base images (registry reachability)
        run: |
          # Public Hub pulls: parents for the build + this is what BASE_REGISTRY defaults to
          docker pull alpine:3.24.2 >/dev/null && echo "alpine OK"
          docker pull docker.io/pingidentity/pingbase-java:alpine3.24-jdk25 >/dev/null && echo "pingbase-java OK"
      - name: Build pingtoolkit (build_product.sh, public base, no push)
        env:
          # registry-independent: BASE_REGISTRY override → public Hub parents;
          # DEPS registry :5700 (artifactory) NOT needed for a toolkit build.
          BASE_REGISTRY: docker.io/pingidentity
          ARTIFACTORY_REGISTRY: docker.io/pingidentity
        run: |
          chmod +x ci_scripts/*.sh
          ci_scripts/build_product.sh \
            --product pingtoolkit --jvm al25 --no-cache --fail-fast 2>&1 | tail -40
          # build_product.sh pushes on success — capture tags it tried
      - name: Result images
        run: |
          docker images | grep -E "pingtoolkit|REPOSITORY" | head -10
