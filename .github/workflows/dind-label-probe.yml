name: dind label probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ping-internal-x86-dind
    timeout-minutes: 5
    steps:
      - name: Identity + dind check
        run: |
          echo "runner name: $RUNNER_NAME"
          echo "labels visible in env:"; env | grep -i RUNNER_ENV || true
          cat /proc/self/cgroup | head -3 || true
          # is there a docker socket / daemon reachable?
          ls -la /var/run/docker.sock 2>/dev/null || echo "no docker.sock"
          docker version 2>&1 | head -5 || echo "docker CLI missing"
