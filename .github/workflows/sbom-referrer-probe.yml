name: Artifactory SBOM referrer probe (PDI-2391)

# PDI-2391 (row 4 of the PDI-2387 Chainguard V2 story table): does internal
# Artifactory (docker.corp.pingidentity.com:5300) preserve and expose OCI
# referrer attestations after a BuildKit --sbom=true push? If it drops them,
# the SBOM co-deliverable (PDI-2393) fails silently.
#
#   push  : docker buildx build --sbom=true --push via the docker-container
#           driver — attestations require it (the classic docker driver
#           drops/forbids them unless the daemon has the containerd image
#           store, which the dind sidecar is not guaranteed to have).
#   verify: oras discover + cosign download attestation + raw referrers API
#           + tag-schema fallback probe. Artifactory historically coalesces
#           attestations into sha256-<digest>.* manifest tags instead of
#           implementing the OCI-1.1 referrers API — which path answers is
#           exactly the "Artifactory version/config notes" the AC asks for.
#
# Result semantics: job FAIL = SBOM attestation not retrievable after push
# (the documented negative result PDI-2391's AC asks for — not a pipeline
# regression; this workflow is dispatch-only). Job PASS = green round trip;
# the step summary is the documentation artifact. x86_64 only; an arm64
# mirror is a copy-paste of this job onto ping-internal-arm-dind if the
# referrer behavior ever needs arch parity evidence.
#
# Story-0 tie-in (PDI-2388): the manually published eval image
# pingbase:chainguard-test (2026-05 demo) is probed as a secondary data
# point if it still exists.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REPO: pdi-2391-sbom-probe
  BUILDX_VERSION: v0.39.1
  ORAS_VERSION: 1.4.0

jobs:
  probe:
    name: sbom referrer round trip (x86_64 dind)
    runs-on: ping-internal-x86-dind
    environment: docker-builds-test
    timeout-minutes: 20
    env:
      # REG lives at JOB level: vars.ARTIFACTORY_REGISTRY is scoped to the
      # docker-builds-test environment and is invisible to workflow-level env.
      REG: ${{ vars.ARTIFACTORY_REGISTRY }}   # docker.corp.pingidentity.com:5300
      # DOCKER_CONFIG must point at a DIRECTORY; the secret is materialized
      # as ${DOCKER_CONFIG}/config.json so docker/buildx/oras/cosign all
      # pick up the artifactory auth from the same store.
      DOCKER_CONFIG: /tmp/docker-config
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 1}

      - name: Materialize DOCKER_CONFIG_JSON secret
        # Same shape as docker-builds-ci.yml build jobs: raw JSON or base64.
        # The docker/oras/buildx calls below all auth from this one store
        # (they read ${DOCKER_CONFIG}/config.json natively). curl-based
        # checks source /tmp/docker-config/creds.sh — a shell file, NOT
        # GITHUB_ENV: derived credentials are not masked by Actions, and a
        # GITHUB_ENV value echoes in every later step's env block (that is
        # how the first live run leaked the artifactory token into the log).
        run: |
          set -euo pipefail
          mkdir -p "${DOCKER_CONFIG}"
          printf '%s' "${DOCKER_CONFIG_JSON_VALUE}" > "${DOCKER_CONFIG}/config.json"
          if ! jq -e . "${DOCKER_CONFIG}/config.json" >/dev/null 2>&1; then
            printf '%s' "${DOCKER_CONFIG_JSON_VALUE}" | base64 -d > "${DOCKER_CONFIG}/config.json"
          fi
          jq -e . "${DOCKER_CONFIG}/config.json" >/dev/null || { echo "DOCKER_CONFIG_JSON is neither JSON nor base64"; exit 1; }
          chmod 600 "${DOCKER_CONFIG}/config.json"
          AUTH_ENTRY=$(jq -r --arg reg "${REG}" '.auths[$reg].auth // empty' "${DOCKER_CONFIG}/config.json")
          if test -z "${AUTH_ENTRY}"; then
            echo "::error::config.json has no auths entry for ${REG}; keys: $(jq -r '.auths | keys | join(", ")' "${DOCKER_CONFIG}/config.json")"
            exit 1
          fi
          BASIC_AUTH=$(printf '%s' "${AUTH_ENTRY}" | base64 -d)
          # Split on first colon only (identity-token passwords contain no colon).
          # add-mask so any accidental echo is redacted; values stay out of env.
          printf '::add-mask::%s\n' "${BASIC_AUTH#*:}"
          umask 077
          {
            printf 'CURL_USER=%q\n' "${BASIC_AUTH%%:*}"
            printf 'CURL_PASS=%q\n' "${BASIC_AUTH#*:}"
          } > "${DOCKER_CONFIG}/creds.sh"
          jq -r '.auths | keys[]' "${DOCKER_CONFIG}/config.json" | sed 's/^/auths entry: /'
        env:
          DOCKER_CONFIG_JSON_VALUE: ${{ secrets.DOCKER_CONFIG_JSON }}

      - name: Install buildx + oras + cosign
        # Self-contained installs (no ./.github/actions/setup-tools): that
        # composite action is not on master, and this probe must dispatch
        # from the default branch. Mirrors setup-tools' cosign install.
        run: |
          set -euo pipefail
          if ! docker buildx version >/dev/null 2>&1; then
            mkdir -p ~/.docker/cli-plugins
            curl -fsSL --retry 3 -o ~/.docker/cli-plugins/docker-buildx \
              "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-amd64"
            chmod +x ~/.docker/cli-plugins/docker-buildx
          fi
          docker buildx version
          curl -fsSL --retry 3 -o /tmp/oras.tgz \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/oras.tgz -C /tmp oras
          sudo install -m 0755 /tmp/oras /usr/local/bin/oras
          oras version
          COSIGN_VERSION=3.0.6
          arch=$(uname -m); case "${arch}" in x86_64) carch=amd64;; aarch64) carch=arm64;; *) carch=amd64;; esac
          if ! command -v cosign >/dev/null 2>&1; then
            curl -fsSL --retry 3 -o /tmp/cosign \
              "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-${carch}"
            sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign
          fi
          cosign version

      - name: Preflight (daemon, TLS, auth, Artifactory version)
        run: |
          set -euo pipefail
          . "${DOCKER_CONFIG}/creds.sh"
          docker version
          echo "=== daemon storage driver (containerd store would enable the plain docker driver) ==="
          docker info -f 'storage driver: {{.Driver}}'
          echo "=== anonymous registry API reachability ==="
          code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 "https://${REG}/v2/" || echo ERR)
          echo "GET /v2/ -> ${code} (401 = reachable + auth-gated, expected)"
          echo "=== authed registry API (basic auth from DOCKER_CONFIG_JSON, user ${CURL_USER}) ==="
          code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 \
            -u "${CURL_USER}:${CURL_PASS}" "https://${REG}/v2/" || echo ERR)
          echo "GET /v2/ (authed) -> ${code}"
          if test "${code}" != 200; then
            echo "::warning::authed /v2/ not 200 — push step will be the real auth test"
          fi
          echo "=== Artifactory version (admin-gated; 403 recorded as-is) ==="
          curl -sS --connect-timeout 10 -u "${CURL_USER}:${CURL_PASS}" \
            "https://${REG}/artifactory/api/system/version" || true
          echo

      - name: Install corp TLS chain for the dind daemon + buildkitd
        # curl trusts the chain from the pod system store, but dockerd and
        # (via certs.d mount) the nested buildkitd container each consult
        # /etc/docker/certs.d/<host:port>/ — populate it from the live TLS
        # handshake so both trust docker.corp.pingidentity.com:5300.
        run: |
          set -euo pipefail
          CERTS_DIR="/etc/docker/certs.d/${REG}"
          CHAIN=$(mktemp)
          echo Q | openssl s_client -connect "${REG}" -servername docker.corp.pingidentity.com -showcerts 2>/dev/null \
            | awk '/BEGIN CERTIFICATE/,/END CERTIFICATE/{print}' > "${CHAIN}"
          if test ! -s "${CHAIN}"; then
            echo "::warning::could not extract TLS chain via openssl — assuming system-store trust is enough"
            exit 0
          fi
          sudo mkdir -p "${CERTS_DIR}"
          sudo cp "${CHAIN}" "${CERTS_DIR}/ca.crt"
          echo "installed $(grep -c 'BEGIN CERTIFICATE' "${CHAIN}") cert(s) to ${CERTS_DIR}/ca.crt"
          # Restart not required: dockerd re-reads certs.d per connection.

      - name: Build + push scratch image with --sbom=true
        run: |
          set -euo pipefail
          . "${DOCKER_CONFIG}/creds.sh"
          REF="${REG}/${REPO}:run-${GITHUB_RUN_ID}"
          echo "REF=${REF}" >> "${GITHUB_ENV}"
          mkdir -p /tmp/probe-ctx
          cat > /tmp/probe-ctx/Dockerfile <<'EOF'
          FROM alpine:3.24.2
          RUN echo "PDI-2391 sbom referrer probe" > /probe.txt
          EOF
          # Attestations need a builder that can produce them: the
          # docker-container driver always can; the embedded "docker" driver
          # only with the daemon's containerd image store. Try
          # docker-container first (nested dind may refuse — bootstrap needs
          # mount caps); on failure, fall back to the docker driver when the
          # daemon reports containerd storage, else record the limitation.
          # Bootstrap pulls moby/buildkit from Docker Hub: anonymous pulls
          # now require auth (live run 44635234137), so log in first with
          # the staged DOCKER_USERNAME/DOCKER_ACCESS_TOKEN.
          docker login --username "${DOCKER_USERNAME_VALUE}" --password-stdin <<< "${DOCKER_ACCESS_TOKEN_VALUE}" || {
            echo "::warning::docker hub login failed — buildkit bootstrap pull may be rejected"
          }
          DRIVER=docker-container
          docker buildx rm "pdi2391-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
          if ! docker buildx create --name "pdi2391-${GITHUB_RUN_ID}" \
               --driver docker-container --bootstrap --use >/tmp/bx-bootstrap.log 2>&1; then
            echo "docker-container driver bootstrap failed inside dind:"
            tail -5 /tmp/bx-bootstrap.log
            STORE=$(docker info -f '{{.Driver}}')
            echo "daemon storage driver: ${STORE}"
            if test "${STORE}" = containerd; then
              echo "→ falling back to embedded docker driver (containerd store present)"
              DRIVER=docker
            else
              echo "::error::no attestation-capable builder available in this dind environment — record as probe finding"
              exit 1
            fi
          fi
          docker buildx build \
            --sbom=true \
            --tag "${REF}" \
            --push \
            --file /tmp/probe-ctx/Dockerfile \
            /tmp/probe-ctx
          echo "pushed ${REF} (builder driver: ${DRIVER})"
          echo "BUILDER_DRIVER=${DRIVER}" >> "${GITHUB_ENV}"
        env:
          DOCKER_USERNAME_VALUE: ${{ vars.DOCKER_USERNAME }}
          DOCKER_ACCESS_TOKEN_VALUE: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Verify referrers survived the round trip
        run: |
          set -euo pipefail
          . "${DOCKER_CONFIG}/creds.sh"
          NOTES=/tmp/probe-notes.md
          : > "${NOTES}"
          note(){ echo "$*" >> "${NOTES}"; }
          RC_CFG="${DOCKER_CONFIG}/config.json"
          CRED=(-u "${CURL_USER}:${CURL_PASS}")

          # 1. resolve the pushed index digest
          DESC=$(oras manifest fetch --descriptor --registry-config "${RC_CFG}" "${REF}")
          INDEX_DIGEST=$(printf '%s' "${DESC}" | jq -r .digest)
          note "Pushed index \`${REF}\` @ \`${INDEX_DIGEST}\` ($(printf '%s' "${DESC}" | jq -r .mediaType))"
          note ""
          echo "index digest: ${INDEX_DIGEST}"

          # 2. what actually landed: --sbom=true embeds attestation manifests
          #    as entries of the pushed index itself — check they survived
          curl -sS "${CRED[@]}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://${REG}/v2/${REPO}/manifests/${INDEX_DIGEST}" > /tmp/index.json 2>/dev/null || echo '{}' > /tmp/index.json
          note "### Pushed index contents (fetched back from Artifactory)"
          note '```json'
          jq -c '.manifests[]? | {mediaType, artifactType, attestation: .annotations["vnd.docker.reference.type"], arch: .platform.architecture}' /tmp/index.json >> "${NOTES}" 2>/dev/null || echo "(index not retrievable or not an index)" >> "${NOTES}"
          note '```'
          IDX_ATTEST=$(jq '[.manifests[]? | select(.artifactType != null or .annotations["vnd.docker.reference.type"] != null)] | length' /tmp/index.json 2>/dev/null || echo 0)
          note "attestation-manifest entries in index: **${IDX_ATTEST}** (BuildKit pushes provenance + sbom entries)"
          note ""
          echo "index attestation entries: ${IDX_ATTEST}"

          # 3. raw OCI-1.1 referrers API — the AC's "oras discover" path
          RCODE=$(curl -sS -o /tmp/referrers.json -w '%{http_code}' \
            "${CRED[@]}" -H 'Accept: application/vnd.oci.image.index.v1+json' \
            "https://${REG}/v2/${REPO}/referrers/${INDEX_DIGEST}" || echo ERR)
          API_COUNT=$(jq -r '.manifests | length // 0' /tmp/referrers.json 2>/dev/null || echo 0)
          note "### Raw referrers API"
          note "GET /v2/${REPO}/referrers/... → HTTP ${RCODE}, ${API_COUNT} referrer(s)"
          if test "${RCODE}" = 200 && test "${API_COUNT}" -gt 0 2>/dev/null; then
            note ""
            note '```json'
            head -c 800 /tmp/referrers.json >> "${NOTES}"
            note ''
            note '```'
          else
            head -c 300 /tmp/referrers.json 2>/dev/null >> "${NOTES}" || true
            note ''
          fi
          echo "referrers API: HTTP ${RCODE}, ${API_COUNT} referrer(s)"
          echo "REFERRERS_API_CODE=${RCODE}" >> "${GITHUB_ENV}"

          # 4. SBOM payload reachable — the actual AC: "attestation manifest is
          #    verified to be accessible". Fetch every candidate attestation
          #    manifest (index entries + referrers results, deduped) and its
          #    in-toto/spdx/cyclonedx layer blob. Blobs are fetched to files:
          #    in-toto SBOM layers are gzipped (binary) — command substitution
          #    chokes on the null bytes (live run 44635590010).
          SBOM_FOUND=no
          for RDIG in $(jq -r '.manifests[]?.digest // empty' /tmp/index.json /tmp/referrers.json 2>/dev/null | sort -u); do
            curl -sS "${CRED[@]}" \
              -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              -o /tmp/ref-manifest.json \
              "https://${REG}/v2/${REPO}/manifests/${RDIG}" 2>/dev/null || continue
            LAYER=$(jq -r '.layers[0].digest // empty' /tmp/ref-manifest.json 2>/dev/null)
            MEDIA=$(jq -r '.layers[0].mediaType // "?"' /tmp/ref-manifest.json 2>/dev/null)
            if test -z "${LAYER}"; then
              note "manifest ${RDIG}: layer NOT retrievable (image layer or dropped attestation)"
              continue
            fi
            curl -sS "${CRED[@]}" -o /tmp/ref-payload.bin \
              "https://${REG}/v2/${REPO}/blobs/${LAYER}" 2>/dev/null || true
            # gzip layers are the norm for attestation blobs; decompress by magic
            if head -c2 /tmp/ref-payload.bin | grep -q $'\x1f\x8b' 2>/dev/null; then
              gunzip -c /tmp/ref-payload.bin > /tmp/ref-payload.json 2>/dev/null || cp /tmp/ref-payload.bin /tmp/ref-payload.json
            else
              cp /tmp/ref-payload.bin /tmp/ref-payload.json
            fi
            PT=$(jq -r '.predicateType // empty' /tmp/ref-payload.json 2>/dev/null)
            note "manifest ${RDIG}: layer ${MEDIA}, predicateType=${PT:-<unreadable>}"
            case "${PT}" in
              *spdx*|*cyclonedx*) SBOM_FOUND=yes ;;
            esac
          done
          note ""
          note "### SBOM payload fetch"
          note "SBOM attestation payload served by Artifactory: **${SBOM_FOUND}**"
          echo "SBOM payload served: ${SBOM_FOUND}"

          # 5. oras discover (AC primary check; record-only — the payload
          #    check above is the gate, so an oras output-format quirk cannot
          #    mask a registry that genuinely serves referrers)
          DISC=$(oras discover --format json --registry-config "${RC_CFG}" "${REF}" 2>/dev/null \
            || oras discover -o json --registry-config "${RC_CFG}" "${REF}" 2>/dev/null || echo '{}')
          note ""
          note "### oras discover"
          note '```'
          printf '%s' "${DISC}" | jq -r '.manifests[]? | "\(.artifactType)  \(.digest)"' 2>/dev/null >> "${NOTES}" || echo "(no output)" >> "${NOTES}"
          note '```'
          echo "oras discover referrers: $(printf '%s' "${DISC}" | jq -r '.manifests | length // 0' 2>/dev/null || echo parse-failed)"

          # 6. cosign download attestation (AC alternate check; non-gating)
          if cosign download attestation "${REF}" > /tmp/att.json 2>/tmp/att.err; then
            note ""
            note "### cosign download attestation"
            note "OK — $(wc -c < /tmp/att.json) bytes"
          else
            note ""
            note "### cosign download attestation"
            note "FAILED — \`$(tail -1 /tmp/att.err)\`"
          fi

          # 7. tag-schema fallback (Artifactory's classic attestation coalescing)
          TAGS=$(curl -sS "${CRED[@]}" "https://${REG}/v2/${REPO}/tags/list" 2>/dev/null || echo '')
          SHORTD=$(printf '%s' "${INDEX_DIGEST}" | cut -d: -f2)
          if printf '%s' "${TAGS}" | jq -r '.tags[]' 2>/dev/null | grep -qF "sha256-${SHORTD}"; then
            TAG_SCHEMA=yes
            note ""
            note "### Tag-schema fallback"
            note "sha256-${SHORTD}.* tags present — Artifactory coalescing path"
          else
            TAG_SCHEMA=no
            note ""
            note "### Tag-schema fallback"
            note "no sha256-<digest>.* tags (pure referrers-API registry, or dropped)"
          fi
          note "tags/list: \`(see log)\`"
          echo "TAG_SCHEMA=${TAG_SCHEMA}" >> "${GITHUB_ENV}"

          # 8. buildx imagetools cross-check
          note ""
          note "### docker buildx imagetools inspect"
          note '```'
          docker buildx imagetools inspect "${REF}" 2>&1 | sed 's/^/  /' >> "${NOTES}" || true
          note '```'

          # 9. Story-0 data point: PDI-2388's manually published eval image
          note ""
          note "### Story-0 eval image (PDI-2388, pingbase:chainguard-test)"
          if DESC0=$(oras manifest fetch --descriptor --registry-config "${RC_CFG}" "${REG}/pingbase:chainguard-test" 2>/dev/null); then
            note "still present: $(printf '%s' "${DESC0}" | jq -c .)"
            DISC0=$(oras discover --format json --registry-config "${RC_CFG}" "${REG}/pingbase:chainguard-test" 2>/dev/null \
              || oras discover -o json --registry-config "${RC_CFG}" "${REG}/pingbase:chainguard-test" 2>/dev/null || echo '{}')
            note "referrers: \`${DISC0}\`"
          else
            note "not found (retired or different repo path) — skipped"
          fi

          # gate
          note ""
          if test "${SBOM_FOUND}" = yes; then
            note "**RESULT: PASS — SBOM attestation survived the Artifactory round trip**"
            echo "RESULT=PASS" >> "${GITHUB_ENV}"
          else
            note "**RESULT: FAIL — SBOM attestation not retrievable after push**"
            echo "RESULT=FAIL" >> "${GITHUB_ENV}"
          fi

      - name: Summary + interpretation
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## PDI-2391 — Artifactory SBOM referrer probe"
            echo ""
            if test -f /tmp/probe-notes.md; then
              cat /tmp/probe-notes.md
            else
              echo "(verify step did not reach note-taking — see job log for the failure)"
            fi
            echo ""
            echo "### Artifactory version/config notes"
            echo ""
            echo "- referrers API: HTTP ${REFERRERS_API_CODE:-n/a}"
            echo "- tag-schema coalescing tags: ${TAG_SCHEMA:-n/a}"
            echo "- Artifactory system version: admin-gated for the publisher token; see preflight log output"
            echo "- builder driver: ${BUILDER_DRIVER:-n/a} (docker-container = attestation-native; docker = containerd store)"
            echo ""
            echo "### Interpretation (per PDI-2391 AC)"
            echo ""
            if test "${RESULT:-UNSET}" = PASS; then
              echo "- Artifactory preserves and serves BuildKit --sbom=true referrers — the SBOM co-deliverable (PDI-2393) can ride OCI attestations; no alternative mechanism needed."
              if test "${IDX_ATTEST:-0}" -gt 0 2>/dev/null && test "${REFERRERS_API_CODE:-}" != 200; then
                echo "- nuance: SBOM rides **inside the pushed index** (BuildKit embedded attestations) rather than via referrers API — delivery works but referrer-based discovery does not."
              fi
            elif test "${REFERRERS_API_CODE:-}" = 404 && test "${TAG_SCHEMA:-}" = yes; then
              echo "- Referrers API not implemented, but tag-schema coalescing present → SBOMs ARE stored; tooling must be fallback-aware (oras/cosign are). Not a silent drop."
            elif test "${REFERRERS_API_CODE:-}" = 404 && test "${TAG_SCHEMA:-}" = no; then
              echo "- Referrers dropped at push → alternative SBOM delivery required: post-push \`cosign attest\` sidecar, SBOM as separate Artifactory generic artifact, or registry-side SBOM generation (Xray)."
            else
              echo "- See job log: push/auth/TLS failure or partial round trip — this is a plumbing result, not yet an Artifactory referrer verdict."
            fi
            echo "- Probe images accumulate under \`${REPO}:run-*\` (throwaway; cleanup is a registry-side follow-up, deletion not granted to the publisher token)."
          } >> "${GITHUB_STEP_SUMMARY}"
          cat /tmp/probe-notes.md 2>/dev/null || true

      - name: Gate
        run: |
          if test "${RESULT:-UNSET}" != PASS; then
            echo "PDI-2391 probe: FAIL (RESULT=${RESULT:-UNSET}) — see step summary"
            exit 1
          fi
          echo "PDI-2391 probe: PASS"

      - name: Cleanup builder
        if: always()
        run: docker buildx rm "pdi2391-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
