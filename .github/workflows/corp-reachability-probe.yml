name: dind runner — corp endpoint reachability probe

# The dind runner builds (run 43065092879 PASS) but bypassed artifactory.
# This probe answers whether the dind runner pods can reach the corp-DNS-only
# endpoints the real pipeline needs — the same question DEVHELP-48014 asks for
# GCB, answered for the runner we can use TODAY. No credentials: bare
# GET/HEAD, record HTTP codes (401/403 = reachable + auth-gated = success).
# Dispatch-only, no secrets.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: reachability (x86 dind)
    runs-on: ping-internal-x86-dind
    timeout-minutes: 10
    steps:
      - name: DNS resolution
        run: |
          for h in docker.corp.pingidentity.com art01.corp.pingidentity.com bld-fed01.corp.pingidentity.com bld-pat.corp.pingidentity.com nexus-eng.austin-eng.ping-eng.com nexus-qa.austin-eng.ping-eng.com; do
            if getent hosts "$h" >/dev/null 2>&1; then
              echo "DNS OK   $h -> $(getent hosts "$h" | awk '{print $1}' | head -1)"
            else
              echo "DNS FAIL $h"
            fi
          done
      - name: TLS + HTTP reachability (no auth — 401/403 counts as reachable)
        run: |
          # artifactory registries the build/deploy stages use
          urls=(
            "https://docker.corp.pingidentity.com:5300/artifactory/api/system/ping"
            "https://docker.corp.pingidentity.com:5700/artifactory/api/system/ping"
            "https://art01.corp.pingidentity.com/artifactory/repo/com/pingidentity/"
            "https://bld-fed01.corp.pingidentity.com/"
            "https://bld-pat.corp.pingidentity.com/"
            "http://nexus-eng.austin-eng.ping-eng.com:8080/nexus/content/repositories/snapshots/"
            "http://nexus-qa.austin-eng.ping-eng.com:8081/nexus/service/local/repositories/snapshots/content"
          )
          for u in "${urls[@]}"; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 20 "$u" 2>/tmp/curl.err || echo "ERR")
            if [ "$code" = "ERR" ]; then
              echo "FAIL $code $u — $(tail -1 /tmp/curl.err)"
            else
              echo "OK   HTTP $code  $u"
            fi
          done
      - name: Docker pull from corp artifactory (deps registry)
        run: |
          # The real test: can the daemon pull the dind image family from :5700?
          # Anonymous pull attempt — record result, auth error is still reachability.
          docker pull docker.corp.pingidentity.com:5700/docker:27-dind 2>&1 | tail -3 || true
